# Al empujar un tag "v1.2.3": controla que coincida con app/version.py, corre los tests y publica el release en
# GitHub (con las notas generadas a partir de los commits; el código va como .zip/.tar.gz que GitHub agrega solo).
# A diferencia del release.yml de appbase NO compila un .exe: esta app corre como servidor LAN (ver app/version.py).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: El tag coincide con app/version.py
        shell: bash
        run: |
          version=$(python -c "import app.version as v; print(v.VERSION)")
          if [ "v$version" != "${{ github.ref_name }}" ]; then
            echo "El tag ${{ github.ref_name }} no coincide con VERSION=$version de app/version.py"; exit 1
          fi
      - name: Dependencias
        run: python -m pip install -r requirements.txt pytest httpx
      - name: Tests
        run: python -m pytest -q
      - name: Publicar el release
        uses: softprops/action-gh-release@v2
        with:
          name: Ajuste de Composición ${{ github.ref_name }}
          generate_release_notes: true
